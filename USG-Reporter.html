<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1b2430;--mut:#6b7684;--line:#dfe4ea;--pri:#0b6e8a;--pri2:#e3f2f6;--ab:#b4471f;--ab2:#fdeee6;--nm:#2c7a4b;--nm2:#e6f4ec}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer}
.view{max-width:760px;margin:0 auto;padding:0 max(12px,env(safe-area-inset-right)) 24px max(12px,env(safe-area-inset-left))}
html{-webkit-text-size-adjust:100%}
.bar{padding-top:max(10px,env(safe-area-inset-top))!important}.home-hd{padding-top:max(22px,calc(env(safe-area-inset-top) + 8px))!important}
.actions{padding-bottom:max(12px,env(safe-area-inset-bottom))!important}
.filel{display:inline-block;cursor:pointer;text-align:center}
@media print{
  @page{size:A4;margin:14mm 16mm}
  body{background:#fff!important}
  #home,#builder,#modal,#toast,.bar,.actions,.fab{display:none!important}
  #preview{display:block!important;max-width:none;padding:0!important}
  .paper{border:0!important;box-shadow:none!important;padding:0!important;overflow:visible!important}
  #rep.editing{outline:0}
}
.muted{color:var(--mut)}.small{font-size:12px}.pad{padding:8px 4px}
/* home */
.home-hd{display:flex;align-items:center;justify-content:space-between;padding:22px 4px 14px}
.app-t{font-size:24px;font-weight:700;color:var(--pri)}.app-s{color:var(--mut);font-size:13px}
.icon{border:0;background:var(--card);width:42px;height:42px;border-radius:12px;font-size:22px;box-shadow:0 1px 2px #0001;color:var(--ink)}
.h-lab{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:18px 4px 8px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;font-weight:600;text-align:left;color:var(--ink)}
.tcard .ti{font-size:26px;color:var(--pri)}
.resume{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--pri2);border:1px solid #b9dde7;color:var(--pri);border-radius:12px;padding:12px 14px;text-align:left}
.hist{display:flex;flex-direction:column;gap:6px}
.hrow{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.hmain{flex:1;display:flex;flex-direction:column;min-width:0}.hmain span{color:var(--mut);font-size:12px}
.sm{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;color:var(--ink)}.sm.ghost{border:0;color:var(--mut)}
/* bars */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:var(--bg);padding:10px 0}
.bt{flex:1;font-weight:700;font-size:17px}
.pri{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.ghostb{background:transparent;border:1px solid var(--line);border-radius:10px;padding:9px 14px;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
/* fields */
.grid2,.meas,.ifs{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:3px;flex:1 1 140px;min-width:120px}
.fld.wide{flex-basis:100%}
.fld>span:first-child{font-size:12px;color:var(--mut)}
input,select,textarea{font-size:16px!important;font-family:inherit;line-height:inherit;color:var(--ink);background:#fbfcfd;border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #0b6e8a55;border-color:var(--pri)}
.inw{display:flex;align-items:center;gap:6px}.inw .u{color:var(--mut);font-size:13px;white-space:nowrap}
.dims input{text-align:center}.dims i{color:var(--mut);font-style:normal}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;background:#fbfcfd;padding:9px;color:var(--ink)}.seg button.on{background:var(--pri);color:#fff}
/* sections */
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.sec header{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;user-select:none}
.sn{flex:1;font-weight:600}.car{color:var(--mut)}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px}
.badge.nm{background:var(--nm2);color:var(--nm)}.badge.ab{background:var(--ab2);color:var(--ab)}
.sb{padding:0 14px 14px;border-top:1px solid var(--line)}
.meas{padding-top:12px}
.add-l{font-size:12px;color:var(--mut);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fbfcfd;border-radius:20px;padding:7px 12px;font-size:13.5px;color:var(--ink)}
.chip.sel{background:var(--ab2);border-color:#f0c4ad;color:var(--ab)}
.chip.tog.on{background:var(--pri);border-color:var(--pri);color:#fff}
.items{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.item{border:1px solid #f0c4ad;background:#fffaf7;border-radius:12px;padding:10px}
.ih{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}.ih b{color:var(--ab)}
.ct{border:0;background:transparent;color:var(--ab);font-size:14px;padding:0 2px}.ih b{cursor:pointer}
.dup{margin-left:auto;border:1px solid #f0c4ad;background:#fff;color:var(--ab);border-radius:8px;font-size:15px;padding:2px 8px}
.dup+.x{margin-left:0}
.item.col .ih{margin-bottom:0}.isum{font-size:12.5px;color:var(--mut);margin-top:4px}
.another{border:1.5px dashed #e0a585;background:#fffaf7;color:var(--ab);border-radius:12px;padding:10px;font-weight:600}
.x{margin-left:auto;border:0;background:transparent;color:var(--mut);font-size:16px;padding:2px 6px}
.tr{font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px}
.tr1,.tr2{background:var(--nm2);color:var(--nm)}.tr3{background:#fff6d8;color:#8a6500}.tr4{background:#ffe7d4;color:#a14a00}.tr5{background:#fbe0e0;color:#a31c1c}
.note{margin-top:12px}
.prev{margin-top:12px;background:#f7f9fb;border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:13.5px}
.prev .pl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-bottom:4px}
.pi{margin-top:6px;color:var(--ab);font-weight:600}
.vtab{flex-basis:100%}.vtab table{width:100%;border-collapse:collapse}.vtab th{font-size:12px;color:var(--mut);font-weight:600;padding:2px}
.vtab td{padding:2px}.vtab td:first-child{font-weight:600;font-size:13px;padding-right:6px}.vtab input{padding:7px 4px;text-align:center}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));background:var(--pri);color:#fff;border:0;border-radius:28px;padding:14px 26px;font-weight:700;box-shadow:0 6px 18px #0b6e8a55;z-index:6}
.bottom-pad{height:80px}
/* preview */
.paper{background:#fff;border:1px solid var(--line);border-radius:6px;padding:18px 16px;box-shadow:0 2px 8px #0001;overflow-x:auto}
#rep.editing{outline:2px dashed var(--pri);outline-offset:6px}
.actions{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--bg);padding:12px 0}
.actions button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 4px;font-weight:600;color:var(--ink)}
.actions .pri{background:var(--pri);color:#fff;border-color:var(--pri)}
/* modal */
#modal{position:fixed;inset:0;background:#0006;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.mbox{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;display:flex;flex-wrap:wrap;gap:10px}
.mh{font-weight:700;font-size:18px;flex-basis:100%}.mmsg{flex-basis:100%;font-size:16px;padding:4px 2px 8px}.pri.danger{background:#b4471f}.addm{white-space:nowrap;padding:9px 12px}
#modal{align-items:center}.mbox{border-radius:18px;margin:12px}.mact{flex-basis:100%;display:flex;justify-content:flex-end;gap:8px}

<body>
<div id="home" class="view"></div>
<div id="builder" class="view" hidden></div>
<div id="preview" class="view" hidden></div>
<div id="modal" hidden></div>
<div id="toast"></div>
<script>
const REPORT_CSS = `
.rep{font:13.5px/1.5 "Times New Roman",Georgia,serif;color:#000}
.rep .inst{text-align:center;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px}
.rep .inst-name{font-size:19px;font-weight:700;letter-spacing:.02em}.rep .inst-addr{font-size:12px}
.rep .pt{width:100%;border-collapse:collapse;border-top:1px solid #000;border-bottom:1px solid #000;margin-bottom:12px}
.rep .pt td{padding:3px 4px;vertical-align:top}
.rep .ttl{text-align:center;font-weight:700;text-decoration:underline;font-size:15px;margin:8px 0 2px}
.rep .mach{text-align:center;font-style:italic;font-size:12.5px;margin-bottom:10px}
.rep .ind{margin-bottom:8px}
.rep .fx{width:100%;border-collapse:collapse}
.rep .fx td{padding:4px 2px;vertical-align:top}
.rep .fx .lab{font-weight:700;white-space:nowrap;width:1%;padding-right:4px}
.rep .fx .col{width:1%;padding:4px 8px 4px 2px;font-weight:700}
.rep .fx .nar{padding-top:6px}
.rep .vt{border-collapse:collapse;margin:6px auto;min-width:70%}
.rep .vt th,.rep .vt td{border:1px solid #000;padding:3px 10px;text-align:center}
.rep .vt small{font-weight:400}
.rep .imp-h{font-weight:700;text-decoration:underline;margin-top:14px}
.rep .imp{margin:4px 0 0;padding-left:20px}.rep .imp li{font-weight:700;margin:2px 0}
.rep .sig{margin-top:36px;text-align:right}.rep .sig-name{font-weight:700}
.rep .foot{margin-top:18px;font-size:11.5px;font-style:italic;text-align:center}
`;
document.getElementById('repcss').textContent = REPORT_CSS;
</script>
<script>
/* USG Reporter — findings library.
 * Section  = {id, name (UI), lab (report label or null for narrative lines), sex:'F'|'M',
 *             meas:[fields], cl:[clauses], fd:[findings], auto(m,ctx)->[{x,t,i}], impN(ctx)}
 * Clause   = {k, t:(m,ctx)=>string}         — the house-style "normal" sentence(s)
 * Finding  = {id, l, rep (repeatable), x:[clause keys it replaces], fs:[fields],
 *             t:(v,m,ctx)=>report text, i:(v,m,ctx)=>impression (string | array | null)}
 * Field    = {k, l, t:'sel'|'num'|'txt'|'chk'|'multi'|'dims'|'vtab', o:[options], u:unit, d:default}
 */
'use strict';

/* ---------- helpers ---------- */
const has = x => x !== undefined && x !== null && String(x).trim() !== '';
const opt = (val, pre = '', post = '') => has(val) ? pre + val + post : '';
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const dims = d => Array.isArray(d) ? d.filter(has).join(' x ') : (has(d) ? String(d) : '');
const nums = d => Array.isArray(d) ? d.filter(has).map(Number) : [];
const vol = d => { const n = nums(d); return n.length === 3 ? +(0.523 * n[0] * n[1] * n[2]).toFixed(1) : null; };
const maxDim = d => { const n = nums(d); return n.length ? Math.max(...n) : null; };
const list = a => { a = (a || []).filter(Boolean); return a.length < 2 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; };
const lc = s => s ? s.toLowerCase() : s;
const S = { R: 'Right', L: 'Left', B: 'Bilateral' };
const sideAdj = s => ({ Right: 'right', Left: 'left', Bilateral: 'bilateral' }[s] || lc(s || ''));

const F = (k, l, t, o, extra) => Object.assign({ k, l, t }, t === 'num' || t === 'dims' ? { u: o } : { o }, extra || {});
const SIDE = F('side', 'Side', 'sel', ['Right', 'Left', 'Bilateral']);
const SIDE2 = F('side', 'Side', 'sel', ['Right', 'Left']);
const NUM1 = F('n', 'Number', 'sel', ['Single', 'Multiple']);

/* ======================================================================
 *  ABDOMEN
 * ==================================================================== */
const LIVER = {
  id: 'liver', name: 'Liver', lab: 'LIVER',
  meas: [F('span', 'Span', 'num', 'cm')],
  cl: [
    { k: 'span', t: m => opt(m.span, 'Span of ', ' cm.') },
    { k: 'sz', t: () => 'Normal in size, shape and echotexture.' },
    { k: 'focal', t: () => 'No evident focal lesion noted.' },
    { k: 'ihbr', t: () => "IHBR's are not dilated." },
  ],
  fd: [
    { id: 'hepatomegaly', l: 'Hepatomegaly', x: ['span', 'sz'], fs: [],
      t: (v, m, c) => 'Enlarged in size' + opt(m.span, ' (span ', ' cm)') + (c.has('fatty') || c.has('cld') ? '.' : ' with normal shape and echotexture.'),
      i: (v, m, c) => c.has('fatty') ? null : 'Hepatomegaly.' },
    { id: 'fatty', l: 'Fatty liver (grade)', x: ['sz'], fs: [F('g', 'Grade', 'sel', ['I', 'II', 'III']), F('spare', 'Focal fat sparing near GB fossa', 'chk')],
      t: (v, m, c) => {
        const d = { I: 'mildly increased echogenicity with normal visualisation of the diaphragm and intrahepatic vessel walls',
          II: 'moderately increased echogenicity with slightly impaired visualisation of the intrahepatic vessel walls and diaphragm',
          III: 'markedly increased echogenicity with poor visualisation of the intrahepatic vessel walls, diaphragm and posterior segment of right lobe' }[v.g || 'I'];
        return (c.has('hepatomegaly') ? 'Shows ' : 'Normal in size and shows ') + d + '.' + (v.spare ? ' Focal fat sparing is seen adjacent to the gall bladder fossa.' : '');
      },
      i: (v, m, c) => (c.has('hepatomegaly') ? 'Hepatomegaly with grade ' : 'Grade ') + (v.g || 'I') + ' fatty liver.' },
    { id: 'cld', l: 'Chronic liver disease / cirrhosis', x: ['sz'],
      fs: [F('size', 'Size', 'sel', ['Normal', 'Shrunken', 'Enlarged']),
           F('feat', 'Features', 'multi', ['coarse heterogeneous echotexture', 'nodular surface', 'blunted margins', 'caudate lobe hypertrophy', 'widened fissures'])],
      t: v => cap((v.size && v.size !== 'Normal' ? lc(v.size) + ' in size' : 'normal in size') + (v.feat && v.feat.length ? ' with ' + list(v.feat) : ' with coarse echotexture') + '.'),
      i: v => 'Features suggestive of chronic liver parenchymal disease' + (v.feat && v.feat.includes('nodular surface') ? ' / cirrhosis' : '') + '.' },
    { id: 'hepatitis', l: 'Acute hepatitis pattern', x: ['sz'], fs: [F('feat', 'Features', 'multi', ['hepatomegaly', 'diffusely reduced echogenicity', 'prominent periportal echogenicity (starry-sky)', 'periportal oedema', 'GB wall oedema'])],
      t: v => 'Shows ' + list(v.feat && v.feat.length ? v.feat : ['diffusely reduced echogenicity', 'prominent periportal echogenicity']) + '.',
      i: () => 'Sonographic features may represent acute hepatitis – correlate with LFT.' },
    { id: 'congestion', l: 'Hepatic congestion', fs: [F('ivc', 'IVC diameter', 'num', 'mm')],
      t: v => 'Hepatic veins and IVC' + opt(v.ivc, ' (IVC ', ' mm)') + ' are dilated with reduced respiratory variation.',
      i: () => 'Features suggestive of congestive hepatopathy.' },
    { id: 'lesion', l: 'Focal lesion', rep: true, x: ['focal'],
      fs: [F('type', 'Type', 'sel', ['Simple cyst', 'Haemangioma', 'Abscess', 'Hydatid cyst', 'Solid lesion (indeterminate)', 'Multiple lesions (?metastases)', 'Calcified granuloma']),
           F('seg', 'Segment', 'sel', ['', 'I', 'II', 'III', 'IVa', 'IVb', 'V', 'VI', 'VII', 'VIII', 'right lobe', 'left lobe', 'both lobes']),
           F('sz', 'Size', 'dims', 'cm'),
           F('echo', 'Echo (solid lesion)', 'sel', ['hypoechoic', 'hyperechoic', 'isoechoic', 'heterogeneous', 'target / bull\'s-eye']),
           F('vasc', 'Vascularity', 'sel', ['', 'no internal vascularity', 'internal vascularity', 'peripheral vascularity'])],
      t: v => {
        const at = opt(v.seg, v.seg && /lobe/.test(v.seg) ? ' in the ' : ' in segment ');
        const sz = opt(dims(v.sz), ' measuring ', ' cm');
        const vs = opt(v.vasc, ' with ');
        const vo = vol(v.sz);
        switch (v.type) {
          case 'Haemangioma': return 'A well-defined homogeneously hyperechoic lesion' + sz + vs + at + ' – likely haemangioma.';
          case 'Abscess': return 'An ill-defined hypoechoic lesion with internal echoes / debris' + sz + (vo ? ' (volume ~' + vo + ' cc)' : '') + at + ' – likely liver abscess.';
          case 'Hydatid cyst': return 'A cystic lesion with internal septations / daughter cysts' + sz + at + ' – likely hydatid cyst.';
          case 'Solid lesion (indeterminate)': return 'A ' + (v.echo || 'hypoechoic') + ' solid lesion' + sz + vs + at + '.';
          case 'Multiple lesions (?metastases)': return 'Multiple ' + (v.echo || 'hypoechoic') + ' lesions are noted' + (v.seg ? ' in ' + (/lobe/.test(v.seg) ? 'the ' : 'segment ') + v.seg : ' in both lobes') + opt(dims(v.sz), ', largest measuring ', ' cm') + '.';
          case 'Calcified granuloma': return 'A tiny calcific focus with posterior acoustic shadowing' + at + ' – calcified granuloma.';
          default: return 'A well-defined anechoic cyst with imperceptible wall and posterior acoustic enhancement' + sz + at + '.';
        }
      },
      i: v => {
        const at = v.seg ? (/lobe/.test(v.seg) ? ' in ' + v.seg : ' in segment ' + v.seg) : '';
        return {
          'Simple cyst': 'Simple hepatic cyst' + at + '.',
          'Haemangioma': 'Hepatic lesion' + at + ' – likely haemangioma.',
          'Abscess': 'Liver abscess' + at + '.',
          'Hydatid cyst': 'Hepatic cystic lesion' + at + ' – likely hydatid cyst.',
          'Solid lesion (indeterminate)': 'Solid hepatic lesion' + at + ' – further evaluation with triple-phase CT / MRI recommended.',
          'Multiple lesions (?metastases)': 'Multiple hepatic lesions – likely metastases; suggested CECT correlation.',
          'Calcified granuloma': 'Calcified hepatic granuloma.',
        }[v.type || 'Simple cyst'];
      } },
    { id: 'ihbrd', l: 'IHBR dilatation', x: ['ihbr'], fs: [F('deg', 'Degree', 'sel', ['Mild', 'Moderate', 'Gross']), F('lobe', 'Lobe', 'sel', ['both lobes', 'right lobe', 'left lobe'])],
      t: v => lc(v.deg || 'Mild').replace(/^./, c => c.toUpperCase()) + ' dilatation of IHBR\'s is noted in ' + (v.lobe || 'both lobes') + '.',
      i: v => cap(lc(v.deg || 'mild')) + ' intrahepatic biliary radicle dilatation.' },
  ],
};

const PORTA = {
  id: 'porta', name: 'Porta hepatis / CBD', lab: 'PORTA HEPATIS',
  meas: [F('pv', 'Portal vein', 'num', 'mm'), F('cbd', 'CBD', 'num', 'mm')],
  cl: [
    { k: 'pv', t: m => 'Portal vein not dilated' + opt(m.pv, ' (', ' mm)') + '.' },
    { k: 'cbd', t: m => 'CBD not dilated' + opt(m.cbd, ' (', ' mm)') + '.' },
  ],
  fd: [
    { id: 'pht', l: 'Portal hypertension', x: ['pv'], fs: [F('feat', 'Features', 'multi', ['dilated portal vein', 'reduced portal venous velocity', 'hepatofugal flow', 'porto-systemic collaterals', 'recanalised paraumbilical vein', 'splenomegaly', 'ascites'])],
      t: (v, m) => 'Portal vein' + opt(m.pv, ' measures ', ' mm') + (v.feat && v.feat.length ? '. Noted ' + list(v.feat.filter(x => x !== 'dilated portal vein')) : '') + '.',
      i: () => 'Features of portal hypertension.' },
    { id: 'pvt', l: 'Portal vein thrombosis', x: ['pv'], fs: [F('ext', 'Extent', 'sel', ['Partial', 'Complete']), F('kind', 'Nature', 'sel', ['bland', 'with internal vascularity (?tumour thrombus)']), F('seg', 'Segment', 'sel', ['main portal vein', 'right portal vein', 'left portal vein', 'main and branches'])],
      t: v => 'Echogenic thrombus ' + (v.kind && v.kind !== 'bland' ? v.kind + ' ' : '') + 'is noted in the ' + (v.seg || 'main portal vein') + ' causing ' + lc(v.ext || 'Partial') + ' occlusion' + (v.ext === 'Complete' ? ' with no flow on colour Doppler' : '') + '.',
      i: v => cap(lc(v.ext || 'Partial')) + ' portal vein thrombosis' + (v.kind && v.kind !== 'bland' ? ' – ?tumour thrombus' : '') + '.' },
    { id: 'cbddil', l: 'CBD dilated', x: ['cbd'], fs: [F('cause', 'Cause', 'sel', ['No obvious cause seen', 'Distal CBD obscured by bowel gas', 'Post-cholecystectomy'])],
      t: (v, m) => 'CBD is dilated' + opt(m.cbd, ' (', ' mm)') + '. ' + (v.cause || 'No obvious cause seen') + '.',
      i: (v, m) => 'Dilated CBD' + opt(m.cbd, ' (', ' mm)') + (v.cause === 'Post-cholecystectomy' ? ' – may be post-cholecystectomy; correlate with LFT.' : ' – MRCP correlation suggested.') },
    { id: 'cbdstone', l: 'CBD calculus (choledocholithiasis)', x: ['cbd'], fs: [F('sz', 'Calculus size', 'num', 'mm'), F('loc', 'Location', 'sel', ['distal', 'mid', 'proximal'])],
      t: (v, m) => 'CBD is dilated' + opt(m.cbd, ' (', ' mm)') + ' with an echogenic calculus' + opt(v.sz, ' measuring ', ' mm') + ' showing posterior acoustic shadowing in its ' + (v.loc || 'distal') + ' part.',
      i: () => 'Choledocholithiasis with dilated CBD.' },
    { id: 'pneumobilia', l: 'Pneumobilia', fs: [], t: () => 'Echogenic foci with dirty shadowing / reverberation are seen along the biliary tree – pneumobilia.', i: () => 'Pneumobilia.' },
  ],
};

const GB = {
  id: 'gb', name: 'Gall bladder', lab: 'GALL BLADDER',
  meas: [],
  cl: [
    { k: 'dist', t: () => 'Distended.' },
    { k: 'calc', t: () => 'No evident calculus noted.' },
    { k: 'wall', t: () => 'GB wall has normal thickness.' },
    { k: 'peri', t: () => 'No pericholecystic fluid noted.' },
  ],
  fd: [
    { id: 'postchole', l: 'Post-cholecystectomy', x: ['dist', 'calc', 'wall', 'peri'], fs: [], t: () => 'Not visualised – post-cholecystectomy status.', i: () => 'Post-cholecystectomy status.' },
    { id: 'contracted', l: 'Contracted / partially distended', x: ['dist', 'wall'], fs: [F('why', 'Reason', 'sel', ['post-prandial state', 'unknown'])],
      t: v => 'Contracted / partially distended' + (v.why === 'post-prandial state' ? ' (post-prandial state) – limited evaluation.' : ' – limited evaluation.'), i: () => null },
    { id: 'calculus', l: 'Calculus (cholelithiasis)', x: ['calc'],
      fs: [NUM1, F('sz', 'Size (largest)', 'num', 'mm'), F('mob', 'Mobility', 'sel', ['mobile', 'non-mobile']), F('neck', 'Impacted at GB neck', 'chk'), F('wes', 'GB filled with calculi (WES sign)', 'chk')],
      t: v => v.wes ? 'GB lumen is filled with calculi showing wall-echo-shadow (WES) complex.' :
        (v.n === 'Multiple' ? 'Multiple ' + (v.mob || 'mobile') + ' calculi' + opt(v.sz, ', largest measuring ', ' mm,') : 'A ' + (v.mob || 'mobile') + ' calculus' + opt(v.sz, ' measuring ', ' mm')) +
        ' with posterior acoustic shadowing ' + (v.n === 'Multiple' ? 'are' : 'is') + ' noted in the GB lumen' + (v.neck ? ', with one impacted at the GB neck' : '') + '.',
      i: (v, m, c) => c.has('acute') ? null : 'Cholelithiasis' + (v.neck ? ' with calculus impacted at GB neck' : '') + '.' },
    { id: 'sludge', l: 'Sludge', fs: [F('ball', 'Tumefactive sludge ball', 'chk')],
      t: v => v.ball ? 'Non-shadowing mobile echogenic sludge ball is seen in the dependent part of GB.' : 'Echogenic sludge is noted in the dependent part of GB lumen.',
      i: () => 'GB sludge.' },
    { id: 'polyp', l: 'Polyp', rep: true,
      fs: [F('sz', 'Size', 'num', 'mm'), NUM1, F('risk', 'Morphology (SRU 2022)', 'sel', ['Pedunculated ball-on-the-wall / thin stalk (extremely low risk)', 'Sessile / thick stalk / focal wall thickening ≥4 mm (low risk)'])],
      t: v => (v.n === 'Multiple' ? 'Multiple non-shadowing, non-mobile echogenic polyps are noted arising from the GB wall' + opt(v.sz, ', largest measuring ', ' mm') : 'A non-shadowing, non-mobile echogenic polyp' + opt(v.sz, ' measuring ', ' mm') + ' is noted arising from the GB wall') +
        (v.risk && v.risk.startsWith('Sessile') ? ' (sessile / broad-based).' : '.'),
      i: v => {
        const s = +v.sz, low = v.risk && v.risk.startsWith('Sessile');
        let r = '';
        if (has(v.sz)) {
          if (s >= 15) r = 'surgical consultation recommended';
          else if (s >= 10) r = low ? 'US follow-up at 6, 12 and 24 months or surgical consultation' : 'US follow-up at 6, 12 and 24 months';
          else if (low && s >= 7) r = 'US follow-up at 12 months';
          else r = 'no follow-up required';
        }
        return 'GB polyp' + (v.n === 'Multiple' ? 's' : '') + opt(v.sz, ' (', ' mm)') + (r ? ' – ' + r + ' (SRU 2022 consensus).' : '.');
      } },
    { id: 'acute', l: 'Acute cholecystitis', x: ['dist', 'wall', 'peri'],
      fs: [F('wt', 'Wall thickness', 'num', 'mm'), F('feat', 'Features', 'multi', ['sonographic Murphy\'s sign positive', 'pericholecystic fluid', 'wall striation / oedema', 'calculus impacted at neck', 'intraluminal membranes (?gangrenous)', 'wall hyperaemia'])],
      t: v => 'Distended with diffusely thickened' + opt(v.wt, ' (', ' mm)') + ' oedematous wall' + (v.feat && v.feat.length ? ', ' + list(v.feat) : '') + '.',
      i: (v, m, c) => 'Features suggestive of acute ' + (c.has('calculus') ? 'calculous ' : 'acalculous ') + 'cholecystitis' + (v.feat && v.feat.some(f => f.includes('gangren')) ? ' – ?gangrenous' : '') + '.' },
    { id: 'chronic', l: 'Chronic cholecystitis', x: ['dist', 'wall'], fs: [F('wt', 'Wall thickness', 'num', 'mm')],
      t: v => 'Contracted with thickened wall' + opt(v.wt, ' (', ' mm)') + '.', i: (v, m, c) => c.has('calculus') ? 'Chronic calculous cholecystitis.' : 'Features suggestive of chronic cholecystitis.' },
    { id: 'wallthick', l: 'Diffuse wall thickening (non-specific)', x: ['wall'], fs: [F('wt', 'Wall thickness', 'num', 'mm')],
      t: v => 'GB wall is diffusely thickened' + opt(v.wt, ' (', ' mm)') + '.', i: () => 'Diffuse GB wall thickening – non-specific (hepatitis / hypoproteinaemia / ascites / cardiac causes to be correlated).' },
    { id: 'adeno', l: 'Adenomyomatosis', x: ['wall'], fs: [F('type', 'Type', 'sel', ['fundal', 'segmental', 'diffuse'])],
      t: v => (cap(v.type || 'fundal')) + ' GB wall thickening with echogenic intramural foci showing comet-tail artefacts.', i: v => cap(v.type || 'fundal') + ' adenomyomatosis of GB.' },
    { id: 'gbmass', l: 'GB mass (?carcinoma)', x: ['wall'], fs: [F('sz', 'Size', 'dims', 'cm'), F('inf', 'Infiltrating adjacent liver', 'chk')],
      t: v => 'An irregular heterogeneous soft-tissue mass' + opt(dims(v.sz), ' measuring ', ' cm') + ' is noted arising from the GB wall' + (v.inf ? ', infiltrating the adjacent liver parenchyma' : '') + '.',
      i: () => 'GB mass – suspicious for carcinoma gall bladder; CECT recommended.' },
    { id: 'porcelain', l: 'Porcelain GB', x: ['wall'], fs: [], t: () => 'GB wall shows curvilinear calcification with posterior acoustic shadowing.', i: () => 'Porcelain gall bladder.' },
  ],
};

const PANCREAS = {
  id: 'pancreas', name: 'Pancreas', lab: 'PANCREAS',
  meas: [],
  cl: [{ k: 'n', t: () => 'Visualized head and body appears normal in size and echotexture.' }],
  fd: [
    { id: 'obscured', l: 'Obscured by bowel gas', x: ['n'], fs: [], t: () => 'Obscured by bowel gas – not well visualised.', i: () => null },
    { id: 'acutepanc', l: 'Acute pancreatitis', x: ['n'], fs: [F('feat', 'Features', 'multi', ['bulky', 'hypoechoic', 'heterogeneous', 'peripancreatic fluid', 'peripancreatic fat stranding'])],
      t: v => 'Pancreas appears ' + list((v.feat && v.feat.length ? v.feat : ['bulky', 'hypoechoic']).filter(x => !x.startsWith('peri'))) + ((v.feat || []).filter(x => x.startsWith('peri')).length ? ' with ' + list(v.feat.filter(x => x.startsWith('peri'))) : '') + '.',
      i: () => 'Sonographic features suggestive of acute pancreatitis – correlate with serum amylase / lipase.' },
    { id: 'chronicpanc', l: 'Chronic pancreatitis', x: ['n'], fs: [F('mpd', 'MPD diameter', 'num', 'mm'), F('feat', 'Features', 'multi', ['atrophic', 'parenchymal calcifications', 'intraductal calculi', 'irregular dilated MPD'])],
      t: v => 'Pancreas shows ' + list(v.feat && v.feat.length ? v.feat : ['parenchymal calcifications']) + opt(v.mpd, '; MPD measures ', ' mm') + '.',
      i: () => 'Features suggestive of chronic calcific pancreatitis.' },
    { id: 'pseudocyst', l: 'Pseudocyst / collection', rep: true, fs: [F('sz', 'Size', 'dims', 'cm'), F('loc', 'Location', 'sel', ['lesser sac', 'head region', 'body region', 'tail region', 'peripancreatic'])],
      t: v => 'A well-defined cystic collection' + opt(dims(v.sz), ' measuring ', ' cm') + (vol(v.sz) ? ' (volume ~' + vol(v.sz) + ' cc)' : '') + ' is noted in the ' + (v.loc || 'lesser sac') + '.',
      i: () => 'Pancreatic / peripancreatic collection – ?pseudocyst.' },
    { id: 'pancmass', l: 'Pancreatic mass', fs: [F('loc', 'Location', 'sel', ['head', 'uncinate process', 'neck', 'body', 'tail']), F('sz', 'Size', 'dims', 'cm'), F('duct', 'Double-duct sign (CBD + MPD dilated)', 'chk')],
      t: v => 'An ill-defined hypoechoic mass' + opt(dims(v.sz), ' measuring ', ' cm') + ' is noted in the pancreatic ' + (v.loc || 'head') + (v.duct ? ', with dilatation of both CBD and MPD' : '') + '.',
      i: v => 'Pancreatic ' + (v.loc || 'head') + ' mass – CECT pancreas protocol recommended.' },
  ],
};

const SPLEEN = {
  id: 'spleen', name: 'Spleen', lab: 'SPLEEN',
  meas: [F('len', 'Length', 'num', 'cm')],
  cl: [
    { k: 'sz', t: m => 'Normal in size' + opt(m.len, ' (', ' cm)') + ', shape and echotexture.' },
    { k: 'focal', t: () => 'No evident focal lesion.' },
  ],
  fd: [
    { id: 'splenomegaly', l: 'Splenomegaly', x: ['sz'], fs: [F('g', 'Grade (auto from length if blank)', 'sel', ['', 'Mild', 'Moderate', 'Massive'])],
      t: (v, m) => 'Enlarged in size' + opt(m.len, ' (', ' cm)') + ' with normal echotexture.',
      i: (v, m) => { const g = v.g || (has(m.len) ? (+m.len > 20 ? 'Massive' : +m.len > 15 ? 'Moderate' : 'Mild') : 'Mild'); return g + ' splenomegaly' + opt(m.len, ' (', ' cm)') + '.'; } },
    { id: 'spllesion', l: 'Focal lesion', rep: true, x: ['focal'],
      fs: [F('type', 'Type', 'sel', ['Simple cyst', 'Calcified granulomas', 'Infarct', 'Abscess', 'Haemangioma', 'Solid lesion (indeterminate)']), F('sz', 'Size', 'dims', 'cm')],
      t: v => ({
        'Simple cyst': 'A well-defined anechoic cyst' + opt(dims(v.sz), ' measuring ', ' cm') + ' is noted.',

      t: v => 'Enlarged ' + sideAdj(v.side || 'Right') + ' level ' + (v.lvl || 'II') + ' lymph node' + opt(dims(v.sz), ' measuring ', ' cm') + (v.feat && v.feat.length ? ' with ' + list(v.feat) : '') + ' is noted.', i: v => 'Suspicious ' + sideAdj(v.side || 'Right') + ' level ' + (v.lvl || 'II') + ' cervical lymphadenopathy – FNAC advised.' },
  ],
};

/* ======================================================================
 *  CAROTID / VERTEBRAL DOPPLER
 * ==================================================================== */
const VESSELS = ['CCA', 'Vertebral', 'ICA', 'ECA'];
// SRU 2003 consensus (Grant et al., Radiology 2003) — ICA stenosis by PSV (primary) with EDV / ratio as supporting parameters
function sruGrade(psv, edv, ratio, plaque) {
  if (!has(psv)) return null;
  psv = +psv;
  if (psv > 230) return { g: '≥70% (short of near-occlusion)', sig: true };
  if (psv >= 125) return { g: '50–69%', sig: true };
  return plaque ? { g: '<50%', sig: false } : { g: 'normal (no stenosis)', sig: false };
}
const CAR_IMT = {
  id: 'imt', name: 'Intima-media thickness', lab: null,
  meas: [F('r', 'Right CCA IMT', 'num', 'mm'), F('l', 'Left CCA IMT', 'num', 'mm')],
  cl: [
    { k: 'imt', t: m => { const r = has(m.r) && +m.r > 0.9, l = has(m.l) && +m.l > 0.9;
      return 'B Mode gray scale examinations showed the carotid vessels to have ' + (r && l ? 'increased intimal thickness bilaterally.' : r ? 'increased intimal thickness on the right side and normal intimal thickness on the left side.' : l ? 'increased intimal thickness on the left side and normal intimal thickness on the right side.' : 'normal intimal thickness bilaterally.'); } },
    { k: 'val', t: m => '\nCCA IMT : Right - ' + (has(m.r) ? m.r + ' mm' : '__') + '   Left - ' + (has(m.l) ? m.l + ' mm' : '__') },
  ],
  auto: m => { const r = has(m.r) && +m.r > 0.9, l = has(m.l) && +m.l > 0.9;
    return r && l ? [{ i: 'Bilateral raised CCA IMT suggestive of atherosclerotic changes on both sides.' }] : r || l ? [{ i: (r ? 'Right' : 'Left') + ' raised CCA IMT suggestive of atherosclerotic changes.' }] : []; },
  fd: [],
};
const CAR_LUMEN = {
  id: 'lumen', name: 'Plaques / lumen', lab: null, meas: [],
  cl: [
    { k: 'fill', t: (m, c) => c.hasAny(['plaque', 'thrombus', 'dissection']) ? 'Color Doppler shows normal filling up of the lumen of vessels except as described below.' : 'Color Doppler shows normal filling up of the lumen of vessels.' },
  ],
  fd: [
    { id: 'plaque', l: 'Plaque', rep: true,

      t: v => 'A ' + (v.comp || 'calcified') + ' plaque with ' + (v.surf || 'smooth') + ' surface' + (has(v.th) || has(v.len) ? ' measuring ' + [opt(v.th, '', ' mm (thickness)'), opt(v.len, '', ' mm (length)')].filter(Boolean).join(' x ') : '') + ' is noted in the ' + lc(v.side || 'Right') + ' ' + (v.loc || 'carotid bulb') + opt(v.pct, ', causing ~', '% luminal narrowing') + '.',
      i: v => cap(v.comp || 'calcified') + ' plaque in ' + lc(v.side || 'Right') + ' ' + (v.loc || 'carotid bulb') + ((v.surf || 'smooth') !== 'smooth' ? ' with ' + v.surf + ' surface' : '') + '.' },
    { id: 'thrombus', l: 'Intraluminal thrombus', fs: [SIDE2, F('v', 'Vessel', 'sel', ['CCA', 'ICA', 'ECA'])], t: v => 'Intraluminal echogenic thrombus is noted in the ' + lc(v.side || 'Right') + ' ' + (v.v || 'ICA') + '.', i: v => (v.side || 'Right') + ' ' + (v.v || 'ICA') + ' thrombus.' },
    { id: 'dissection', l: 'Dissection', fs: [SIDE2, F('v', 'Vessel', 'sel', ['CCA', 'ICA', 'vertebral'])], t: v => 'An intimal flap with true and false lumen is noted in the ' + lc(v.side || 'Right') + ' ' + (v.v || 'ICA') + '.', i: v => (v.side || 'Right') + ' ' + (v.v || 'ICA') + ' dissection – CTA / MRA recommended.' },
  ],
};
const CAR_DOP = {
  id: 'dop', name: 'Spectral Doppler (PSV / EDV)', lab: null,
  meas: [F('vt', 'Velocities (cm/s)', 'vtab')],
  cl: [
    { k: 'nost', t: () => 'No evidence of thrombus or flow limiting stenosis seen.' },
    { k: 'spec', t: () => 'On duplex Doppler ultrasonography, normal arterial spectral pattern was seen in the bilateral common carotid, bilateral external carotid arteries and the bilateral internal carotid arteries with normal peak systolic velocities.' },
  ],
  auto: (m, c) => {
    const out = [], sig = [];
    for (const sd of ['R', 'L']) {
      if (c.all.hasSide('occl', sd) || c.all.hasSide('nearoccl', sd)) continue;
      const psv = m['vt_' + sd + '_ICA_ps'], edv = m['vt_' + sd + '_ICA_ed'], cca = m['vt_' + sd + '_CCA_ps'];
      const ratio = has(psv) && has(cca) && +cca > 0 ? +(psv / cca).toFixed(1) : null;
      const g = sruGrade(psv, edv, ratio, c.all.hasSide('plaque', sd));
      if (!g || g.g.startsWith('normal')) continue;
      const side = S[sd];
      out.push({ t: 'The ' + lc(side) + ' ICA shows PSV of ' + psv + ' cm/s' + opt(edv, ', EDV ', ' cm/s') + (ratio ? ', ICA/CCA PSV ratio ' + ratio : '') + (g.sig ? ' with post-stenotic spectral broadening' : '') + ' – consistent with ' + g.g + ' stenosis (SRU consensus criteria).',
        i: side + ' ICA ' + g.g + ' stenosis.', sig: g.sig });
      if (g.sig) sig.push(sd);
    }
    if (sig.length) out.forEach(o => { o.x = ['nost', 'spec']; });
    if (sig.length && sig.length < 2) out.push({ x: ['spec'], t: 'Normal arterial spectral pattern is seen in the remaining vessels.' });
    return out;
  },
  impN: c => c.hasAny(['occl', 'nearoccl', 'ccaSten']) || c.autoSig ? null : 'No evident flow limiting stenosis involving major neck arteries.',
  fd: [
    { id: 'nearoccl', l: 'ICA near-occlusion (string sign)', x: ['nost', 'spec'], side: true, fs: [SIDE2], t: v => 'The ' + lc(v.side || 'Right') + ' ICA shows a markedly narrowed lumen with trickle flow (string sign) – near-occlusion.', i: v => (v.side || 'Right') + ' ICA near-occlusion.' },
    { id: 'occl', l: 'ICA occlusion', x: ['nost', 'spec'], side: true, fs: [SIDE2], t: v => 'No colour or spectral flow is seen in the ' + lc(v.side || 'Right') + ' ICA, which is filled with echogenic material; the ipsilateral CCA shows a high-resistance waveform.', i: v => (v.side || 'Right') + ' ICA total occlusion.' },
    { id: 'ccaSten', l: 'CCA / ECA stenosis', x: ['nost', 'spec'], fs: [SIDE2, F('v', 'Vessel', 'sel', ['CCA', 'ECA']), F('psv', 'PSV', 'num', 'cm/s'), F('pct', 'Estimated narrowing', 'num', '%')],
      t: v => 'The ' + lc(v.side || 'Right') + ' ' + (v.v || 'CCA') + ' shows focal narrowing' + opt(v.pct, ' (~', '%)') + ' with elevated PSV' + opt(v.psv, ' of ', ' cm/s') + ' and post-stenotic turbulence.', i: v => (v.side || 'Right') + ' ' + (v.v || 'CCA') + ' stenosis' + opt(v.pct, ' (~', '%)') + '.' },
  ],
};
const CAR_VERT = {
  id: 'vert', name: 'Vertebral arteries', lab: null, meas: [],
  cl: [{ k: 'n', t: (m, c) => { const s = c.sides(); return !s.R && !s.L ? 'Bilateral vertebral arteries show normal cranial flow.' : !s.R ? 'Right vertebral artery shows normal cranial flow.' : !s.L ? 'Left vertebral artery shows normal cranial flow.' : ''; } }],
  impN: c => { const s = c.sides(); return !s.R && !s.L ? 'Both vertebral arteries show cranial flow.' : !s.R ? 'Right vertebral artery shows cranial flow.' : !s.L ? 'Left vertebral artery shows cranial flow.' : null; },
  fd: [
    { id: 'steal', at: 'n', l: 'Reversed / to-and-fro flow (subclavian steal)', side: true, x: [], fs: [SIDE2, F('type', 'Pattern', 'sel', ['complete reversal (caudal flow)', 'partial (bidirectional / to-and-fro) flow', 'systolic deceleration (pre-steal)'])],
      t: v => 'The ' + lc(v.side || 'Left') + ' vertebral artery shows ' + (v.type || 'complete reversal (caudal flow)') + '.', i: v => (v.side || 'Left') + ' vertebral artery ' + (v.type || 'complete reversal (caudal flow)') + ' – suggestive of ' + lc(v.side || 'Left') + ' subclavian steal; evaluate subclavian artery.' },
    { id: 'vabsent', at: 'n', l: 'No flow / not visualised', side: true, x: [], fs: [SIDE2], t: v => 'No flow is demonstrated in the ' + lc(v.side || 'Right') + ' vertebral artery.', i: v => (v.side || 'Right') + ' vertebral artery – no flow (?occlusion); CTA / MRA suggested.' },
    { id: 'vhypo', at: 'n', l: 'Hypoplastic', side: true, x: [], fs: [SIDE2, F('d', 'Diameter', 'num', 'mm')], t: v => 'The ' + lc(v.side || 'Right') + ' vertebral artery is hypoplastic' + opt(v.d, ' (', ' mm)') + ' with cranial flow.', i: v => 'Hypoplastic ' + lc(v.side || 'Right') + ' vertebral artery with cranial flow.' },
    { id: 'vhr', at: 'n', l: 'High-resistance flow', side: true, x: [], fs: [SIDE2], t: v => 'The ' + lc(v.side || 'Right') + ' vertebral artery shows cranial flow with high-resistance waveform (?distal stenosis).', i: v => (v.side || 'Right') + ' vertebral high-resistance flow – ?distal stenosis.' },
  ],
};

/* ======================================================================
 *  TEMPLATES
 * ==================================================================== */
const SECTIONS = {};
[LIVER, PORTA, GB, PANCREAS, SPLEEN, kidneySide('R'), kidneySide('L'), BLADDER, UTERUS, OVARIES, PROSTATE, MISC, RETRO, BOWEL,
 THY_R, THY_L, THY_I, THYROID, SALIVARY, NECKVESS, NECKLN, CAR_IMT, CAR_LUMEN, CAR_DOP, CAR_VERT].forEach(s => { SECTIONS[s.id] = s; });

const TEMPLATES = [
  { id: 'abd', title: 'Abdomen & Pelvis', heading: 'USG ABDOMEN AND PELVIS', icon: '◐',

  { id: 'carotid', title: 'Carotid–Vertebral Doppler', heading: 'ULTRASOUND CAROTID VERTEBRAL DOPPLER', icon: '≋',

<script>
/* USG Reporter — report engine (pure, no DOM). Builds report blocks + impression from state. */
'use strict';

function fieldDefault(f) {
  if ('d' in f) return f.d;
  if (f.t === 'sel') return f.o[0];
  if (f.t === 'multi') return [];
  if (f.t === 'chk') return false;
  if (f.t === 'dims') return ['', '', ''];
  return '';
}
function newItem(fd) {
  const v = {};
  fd.fs.forEach(f => { v[f.k] = fieldDefault(f); });
  Object.assign(v, fd.d || {});
  return { fid: fd.id, v, uid: Math.random().toString(36).slice(2, 9) };
}

function activeSections(state) {
  const tpl = TEMPLATES.find(t => t.id === state.tpl);
  return tpl.secs.map(id => SECTIONS[id]).filter(s => !s.sex || s.sex === state.patient.sex);
}
function secState(state, id) {
  if (!state.secs[id]) state.secs[id] = { m: {}, items: [], note: '' };
  return state.secs[id];
}
const sideHit = (val, sd) => val === 'Bilateral' || val === S[sd];

function makeCtx(state, sec, st, extra) {
  const items = st.items;
  const ids = items.map(it => it.fid);
  return Object.assign({
    sex: state.patient.sex, meno: state.patient.meno,
    has: id => ids.includes(id),
    hasAny: a => a.some(id => ids.includes(id)),
    count: id => ids.filter(x => x === id).length,
    first: () => true,
    sides: () => {
      const r = { R: false, L: false };
      items.forEach(it => { const fd = sec.fd.find(f => f.id === it.fid); if (fd && fd.side && it.v.side) { if (sideHit(it.v.side, 'R')) r.R = true; if (sideHit(it.v.side, 'L')) r.L = true; } });
      return r;
    },
    all: {
      hasSide: (fid, sd) => activeSections(state).some(s => (state.secs[s.id] || { items: [] }).items.some(it => it.fid === fid && sideHit(it.v.side, sd))),
    },
  }, extra || {});
}

/** Returns {text, imps:[...], table?} for a section */
function buildSection(state, sec) {
  const st = secState(state, sec.id);
  const m = st.m;
  const ctx = makeCtx(state, sec, st);
  const autos = sec.auto ? sec.auto(m, ctx) : [];
  ctx.autoSig = autos.some(a => a.sig);

  // emitters: selected findings + automatic (measurement-driven) findings
  const em = st.items.map((it, idx) => {
    const fd = sec.fd.find(f => f.id === it.fid);
    if (!fd) return null;
    const firstIdx = st.items.findIndex(o => o.fid === it.fid);
    const lastIdx = st.items.map(o => o.fid).lastIndexOf(it.fid);
    const nth = st.items.slice(0, idx + 1).filter(o => o.fid === it.fid).length;
    const c = Object.assign({}, ctx, { first: () => idx === lastIdx, isFirst: idx === firstIdx, n: nth });
    let t = '', i = null;
    try { t = fd.t(it.v, m, c); } catch (e) { t = '[' + fd.l + ']'; console.error(e); }
    try { i = fd.i ? fd.i(it.v, m, c) : null; } catch (e) { console.error(e); }
    return { x: fd.x || [], at: fd.at, t, i, done: false };
  }).filter(Boolean).concat(autos.map(a => ({ x: a.x || [], t: a.t || '', i: a.i || null, done: false })));

  const parts = [];
  sec.cl.forEach(cl => {
    em.filter(e => e.at === cl.k && !e.done).forEach(e => { parts.push(e.t); e.done = true; });
    const over = em.filter(e => e.x.includes(cl.k));
    if (over.length) over.forEach(e => { if (!e.done) { parts.push(e.t); e.done = true; } });
    else parts.push(cl.t(m, ctx));
  });
  em.forEach(e => { if (!e.done) { parts.push(e.t); e.done = true; } });
  if (st.note && st.note.trim()) parts.push(st.note.trim());
  const text = parts.filter(p => p && p.trim()).map(p => p.replace(/^ +| +$/g, '')).join(' ').replace(/ ?\n ?/g, '\n');

  let imps = [];
  em.forEach(e => { if (e.i) imps = imps.concat(e.i); });
  if (!imps.length && sec.impN) { const n = sec.impN(ctx); if (n) imps.push(n); }

  let table = null;
  if (sec.meas.some(f => f.t === 'vtab')) {
    const hasAny = Object.keys(m).some(k => k.startsWith('vt_') && has(m[k]));
    table = { hasAny, rows: VESSELS.map(vs => [vs, ...['R', 'L'].map(sd => {
      const p = m['vt_' + sd + '_' + vs + '_ps'], e = m['vt_' + sd + '_' + vs + '_ed'];
      return has(p) || has(e) ? (has(p) ? p : '–') + ' / ' + (has(e) ? e : '–') : '';
    })]) };
  }
  return { text, imps, table };
}

function mergeImps(list) {
  const out = [], groups = {};
  list.forEach(x => {
    if (x && typeof x === 'object') {
      if (!groups[x.key]) { groups[x.key] = { obj: x, sides: new Set() }; out.push(groups[x.key]); }
      groups[x.key].sides.add(x.side);
    } else if (x && !out.includes(x)) out.push(x);
  });
  return out.map(o => {
    if (typeof o === 'string') return o;
    const s = o.sides;
    return o.obj.f(s.has('R') && s.has('L') ? 'both kidneys' : s.has('R') ? 'right kidney' : 'left kidney');
  });
}

function buildReport(state) {
  const tpl = TEMPLATES.find(t => t.id === state.tpl);
  const blocks = [];
  let imps = [];
  activeSections(state).forEach(sec => {
    const r = buildSection(state, sec);
    if (r.text || sec.lab) blocks.push({ lab: sec.lab, text: r.text, table: r.table });
    imps = imps.concat(r.imps);
  });
  imps = mergeImps(imps);
  if (!imps.length && tpl.normalImp) imps.push(tpl.normalImp);
  (state.extraImp || '').split('\n').map(s => s.trim()).filter(Boolean).forEach(s => imps.push(s));
  return { tpl, blocks, imps };
}

/* ---------- renderers ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const nl = s => esc(s).replace(/\n/g, '<br>');

function fmtDate(d) {
  if (!d) return '';
  const [y, mo, da] = d.split('-');
  return da + '/' + mo + '/' + y;
}

function reportHTML(state, settings) {
  const R = buildReport(state), p = state.patient;
  const age = [p.age ? p.age + (/[a-z]/i.test(p.age) ? '' : ' Y') : '', p.sex === 'F' ? 'F' : 'M'].filter(Boolean).join(' / ');
  let h = '<div class="rep">';
  if (settings.letterhead) h += '<div class="lh-space" style="height:' + (+settings.lhSpace || 35) + 'mm"></div>';
  else if (settings.inst) h += '<div class="inst"><div class="inst-name">' + esc(settings.inst) + '</div>' + (settings.addr ? '<div class="inst-addr">' + esc(settings.addr) + '</div>' : '') + '</div>';
  h += '<table class="pt"><tr><td><b>Name:</b> ' + esc(p.name) + '</td><td><b>Age / Sex:</b> ' + esc(age) + '</td></tr>' +
    '<tr><td><b>Patient ID:</b> ' + esc(p.pid) + '</td><td><b>Date:</b> ' + esc(fmtDate(p.date)) + '</td></tr>' +
    '<tr><td colspan="2"><b>Ref. by:</b> ' + esc(p.ref) + '</td></tr></table>';
  h += '<div class="ttl">' + esc(R.tpl.heading) + '</div>';
  if (state.machine) h += '<div class="mach">(Realtime imaging using probes of ' + esc(state.machine) + ')</div>';
  if (p.ind) h += '<div class="ind"><b>Clinical details:</b> ' + esc(p.ind) + '</div>';
  h += '<table class="fx">';
  R.blocks.forEach(b => {
    if (b.lab) h += '<tr><td class="lab">' + esc(b.lab) + '</td><td class="col">:</td><td>' + nl(b.text) + '</td></tr>';
    else if (b.text) h += '<tr><td colspan="3" class="nar">' + nl(b.text) + '</td></tr>';
    if (b.table && b.table.hasAny) {
      h += '<tr><td colspan="3"><table class="vt"><tr><th></th><th>RIGHT<br><small>PS / EDV (cm/s)</small></th><th>LEFT<br><small>PS / EDV (cm/s)</small></th></tr>' +
        b.table.rows.map(r => '<tr><td><b>' + r[0] + '</b></td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>').join('') + '</table></td></tr>';
    }
  });
  h += '</table>';
  h += '<div class="imp-h">IMPRESSION</div><ul class="imp">' + R.imps.map(i => '<li>' + esc(i) + '</li>').join('') + '</ul>';
  if (settings.doc) h += '<div class="sig"><div class="sig-name">' + esc(settings.doc) + '</div>' + (settings.qual ? '<div>' + esc(settings.qual) + '</div>' : '') + (settings.reg ? '<div>' + esc(settings.reg) + '</div>' : '') + '</div>';
  if (settings.foot) h += '<div class="foot">' + esc(settings.foot) + '</div>';
  h += '</div>';
  return h;
}

function reportText(state) {
  const R = buildReport(state), p = state.patient, out = [];
  out.push('Name: ' + (p.name || '') + '   Age/Sex: ' + (p.age || '') + '/' + p.sex);
  if (p.pid) out.push('ID: ' + p.pid);
  out.push('Date: ' + fmtDate(p.date) + (p.ref ? '   Ref. by: ' + p.ref : ''));
  out.push('', R.tpl.heading);
  if (state.machine) out.push('(Realtime imaging using probes of ' + state.machine + ')');
  if (p.ind) out.push('Clinical details: ' + p.ind);
  out.push('');
  R.blocks.forEach(b => {
    if (b.lab) out.push(b.lab.padEnd(15) + ': ' + b.text); else if (b.text) out.push(b.text);
    if (b.table && b.table.hasAny) {
      out.push('', ''.padEnd(12) + 'RIGHT PS/EDV'.padEnd(18) + 'LEFT PS/EDV');
      b.table.rows.forEach(r => out.push(r[0].padEnd(12) + (r[1] || '').padEnd(18) + (r[2] || '')));
      out.push('');
    }
  });
  out.push('', 'IMPRESSION');
  R.imps.forEach(i => out.push('• ' + i));
  return out.join('\n');
}

if (typeof module !== 'undefined') module.exports = { buildReport, reportText, reportHTML, newItem, secState, activeSections };

</script>
<script>
/* USG Reporter — UI */
'use strict';

const $ = s => document.querySelector(s);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ignore */ } },
};
const Bridge = window.AndroidBridge || null;

let settings = Object.assign({ inst: '', addr: '', doc: '', qual: '', reg: '', foot: '', letterhead: false, lhSpace: 35, machines: DEFAULT_MACHINES.slice() }, LS.get('usg_settings', {}));
let state = null;
let open = {};           // expanded section ids
let editedHTML = null;   // manual edits in preview

const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function blankState(tpl) {
  const last = LS.get('usg_last', {});
  return { tpl, machine: last.machine || settings.machines[0] || '', patient: { name: '', age: '', sex: last.sex || 'F', pid: '', ref: '', date: today(), meno: 'Pre-menopausal', ind: '' }, secs: {}, extraImp: '' };
}
const save = () => { state._saved = false; LS.set('usg_draft', state); };

/* In-app dialogs (Android WebView silently blocks window.confirm / prompt) */
let modalDone = null;
function closeModal(result) { $('#modal').hidden = true; $('#modal').innerHTML = ''; const d = modalDone; modalDone = null; if (d) d(result); }
function ask(msg, okLabel, danger) {
  return new Promise(res => {
    modalDone = res;
    $('#modal').innerHTML = '<div class="mbox"><div class="mmsg">' + esc(msg) + '</div><div class="mact"><button class="ghostb" id="dNo">Cancel</button><button class="pri' + (danger ? ' danger' : '') + '" id="dOk">' + esc(okLabel || 'OK') + '</button></div></div>';
    $('#modal').hidden = false;
    $('#dNo').onclick = () => closeModal(false); $('#dOk').onclick = () => closeModal(true);
  });
}
function askText(title, placeholder) {
  return new Promise(res => {
    modalDone = res;
    $('#modal').innerHTML = '<div class="mbox"><div class="mh">' + esc(title) + '</div><label class="fld wide"><input type="text" id="dTxt" placeholder="' + esc(placeholder || '') + '"></label><div class="mact"><button class="ghostb" id="dNo">Cancel</button><button class="pri" id="dOk">Add</button></div></div>';
    $('#modal').hidden = false;
    const inp = $('#dTxt'); setTimeout(() => inp.focus(), 50);
    const ok = () => closeModal(inp.value.trim() || null);
    $('#dNo').onclick = () => closeModal(null); $('#dOk').onclick = ok;
    inp.onkeydown = e => { if (e.key === 'Enter') ok(); };
  });
}
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(modalDone ? null : undefined); };

function toast(msg) {
  if (Bridge && Bridge.toast) { Bridge.toast(msg); return; }
  const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 1800);
}
function show(view) {
  document.querySelectorAll('.view').forEach(v => v.hidden = v.id !== view);
  window.scrollTo(0, 0);
}

/* ================= HOME ================= */
function renderHome() {
  const draft = LS.get('usg_draft', null);
  const h = [];
  h.push('<div class="home-hd"><div><div class="app-t">USG Reporter</div><div class="app-s">Structured ultrasound reports</div></div><button class="icon" id="btnSet" title="Settings">⚙︎</button></div>');
  if (draft && draft.tpl && !draft._saved) {
    const t = TEMPLATES.find(x => x.id === draft.tpl);
    h.push('<button class="resume" id="btnResume"><span>Resume draft</span><b>' + esc(t ? t.title : '') + (draft.patient.name ? ' · ' + esc(draft.patient.name) : '') + '</b></button>');
  }
  h.push('<div class="h-lab">New report</div><div class="tgrid">');
  TEMPLATES.forEach(t => h.push('<button class="tcard" data-t="' + t.id + '"><span class="ti">' + t.icon + '</span><span>' + esc(t.title) + '</span></button>'));
  h.push('</div>');
  const hist = LS.get('usg_hist', []);
  h.push('<div class="h-lab">Saved reports (' + hist.length + ')</div>');
  if (!hist.length) h.push('<div class="muted pad">Saved reports appear here.</div>');
  h.push('<div class="hist">' + hist.slice().reverse().map(r => '<div class="hrow" data-id="' + r.id + '"><div class="hmain"><b>' + esc(r.state.patient.name || 'Unnamed') + '</b><span>' + esc(TEMPLATES.find(t => t.id === r.state.tpl).title) + ' · ' + fmtDate(r.state.patient.date) + '</span></div><button class="sm" data-act="open">Open</button><button class="sm ghost" data-act="del">✕</button></div>').join('') + '</div>');
  $('#home').innerHTML = h.join('');
  $('#btnSet').onclick = openSettings;
  if ($('#btnResume')) $('#btnResume').onclick = () => { state = draft; editedHTML = null; open = {}; renderBuilder(); show('builder'); };
  document.querySelectorAll('.tcard').forEach(b => b.onclick = async () => {
    if (draft && draft.tpl && !draft._saved && !(await ask('Start a new report? The unsaved draft will be discarded.', 'Start new', true))) return;
    state = blankState(b.dataset.t); editedHTML = null; open = {}; save(); renderBuilder(); show('builder');
  });
  document.querySelectorAll('.hrow').forEach(row => row.querySelectorAll('button').forEach(b => b.onclick = async () => {
    const all = LS.get('usg_hist', []), rec = all.find(r => r.id === row.dataset.id);
    if (b.dataset.act === 'del') { if (await ask('Delete this saved report?', 'Delete', true)) { LS.set('usg_hist', all.filter(r => r.id !== rec.id)); renderHome(); } return; }
    if (draft && draft.tpl && !draft._saved && draft._hid !== rec.id && !(await ask('You have an unsaved draft. Open this saved report and discard the draft?', 'Open', true))) return;
    state = JSON.parse(JSON.stringify(rec.state)); state._hid = rec.id; state._saved = true; editedHTML = rec.html || null;
    LS.set('usg_draft', state); renderPreview(); show('preview');
  }));
}

/* ================= BUILDER ================= */
function fieldHTML(f, val, path) {
  const d = 'data-p="' + path + '"';
  const u = f.u ? '<span class="u">' + esc(f.u) + '</span>' : '';
  switch (f.t) {
    case 'num': return '<label class="fld"><span>' + esc(f.l) + '</span><span class="inw"><input type="number" inputmode="decimal" step="any" ' + d + ' value="' + esc(val) + '">' + u + '</span></label>';
    case 'txt': return '<label class="fld wide"><span>' + esc(f.l) + '</span><input type="text" ' + d + ' value="' + esc(val) + '"></label>';
    case 'dims': { const a = Array.isArray(val) ? val : ['', '', ''];
      return '<label class="fld wide"><span>' + esc(f.l) + '</span><span class="inw dims">' + [0, 1, 2].map(i => '<input type="number" inputmode="decimal" step="any" data-p="' + path + '" data-i="' + i + '" value="' + esc(a[i] || '') + '">').join('<i>×</i>') + u + '</span></label>'; }
    case 'sel':
      if (f.o.length <= 5 && f.o.every(o => o && o.length <= 16))
        return '<div class="fld' + (f.o.join('').length > 18 ? ' wide' : '') + '"><span>' + esc(f.l) + '</span><div class="seg">' + f.o.map(o => '<button data-seg="' + path + '" data-o="' + esc(o) + '" class="' + (o === val ? 'on' : '') + '">' + esc(o) + '</button>').join('') + '</div></div>';
      return '<label class="fld' + (f.o.some(o => o.length > 22) ? ' wide' : '') + '"><span>' + esc(f.l) + '</span><select ' + d + '>' + f.o.map(o => '<option value="' + esc(o) + '"' + (o === val ? ' selected' : '') + '>' + esc(o || '—') + '</option>').join('') + '</select></label>';
    case 'chk': return '<button class="chip tog' + (val ? ' on' : '') + '" data-chk="' + path + '">' + esc(f.l) + '</button>';
    case 'multi': return '<div class="fld wide"><span>' + esc(f.l) + '</span><div class="chips">' + f.o.map(o => '<button class="chip tog' + ((val || []).includes(o) ? ' on' : '') + '" data-multi="' + path + '" data-o="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div></div>';
    case 'vtab': return vtabHTML(path);
  }
  return '';
}
function vtabHTML(path) {
  const m = path.split('|'); const st = secState(state, m[0]).m;
  const cell = (sd, vs, k) => '<input type="number" inputmode="decimal" step="any" data-p="' + m[0] + '|m|vt_' + sd + '_' + vs + '_' + k + '" value="' + esc(st['vt_' + sd + '_' + vs + '_' + k] || '') + '">';
  return '<div class="vtab"><table><tr><th></th><th colspan="2">RIGHT</th><th colspan="2">LEFT</th></tr><tr><th></th><th>PSV</th><th>EDV</th><th>PSV</th><th>EDV</th></tr>' +
    VESSELS.map(vs => '<tr><td>' + vs + '</td><td>' + cell('R', vs, 'ps') + '</td><td>' + cell('R', vs, 'ed') + '</td><td>' + cell('L', vs, 'ps') + '</td><td>' + cell('L', vs, 'ed') + '</td></tr>').join('') +
    '</table><div class="muted small">ICA grading auto-applied per SRU consensus: PSV &lt;125 (with plaque) → &lt;50%; 125–230 → 50–69%; &gt;230 → ≥70%.</div></div>';
}

function secHTML(sec) {
  const st = secState(state, sec.id);
  const isOpen = !!open[sec.id];
  const nf = st.items.length;
  const r = buildSection(state, sec);
  const abnormal = nf || r.imps.length && !(sec.impN && r.imps.length === 1 && r.imps[0] === sec.impN(makeCtx(state, sec, st)));
  let h = '<section class="sec' + (isOpen ? ' open' : '') + '" data-sec="' + sec.id + '">';
  h += '<header data-tog="' + sec.id + '"><span class="sn">' + esc(sec.name) + '</span><span class="badge ' + (abnormal ? 'ab' : 'nm') + '">' + (nf ? nf + ' finding' + (nf > 1 ? 's' : '') : abnormal ? 'auto' : 'Normal') + '</span><span class="car">' + (isOpen ? '▾' : '▸') + '</span></header>';
  if (isOpen) {
    h += '<div class="sb">';
    if (sec.meas.length) h += '<div class="meas">' + sec.meas.map(f => fieldHTML(f, st.m[f.k], sec.id + '|m|' + f.k)).join('') + '</div>';
    if (st.items.length) {
      h += '<div class="items">' + st.items.map((it, idx) => {
        const fd = sec.fd.find(f => f.id === it.fid);
        const total = st.items.filter(o => o.fid === it.fid).length;
        const nth = st.items.slice(0, idx + 1).filter(o => o.fid === it.fid).length;
        const isLast = !st.items.slice(idx + 1).some(o => o.fid === it.fid);
        let extra = '';
        if (it.fid === 'nodule') { const t = tirads(it.v); extra = '<span class="tr tr' + t.tr + '">' + t.p + ' pts · ' + t.name + (it.collapsed ? '' : ' · ' + t.rec) + '</span>'; }
        const title = fd.rep && total > 1 ? fd.l.replace(/ \(.*\)$/, '') + ' ' + nth : fd.l;
        const sum = it.collapsed ? itemSummary(fd, it.v) : '';
        let out = '<div class="item' + (it.collapsed ? ' col' : '') + '"><div class="ih">' +
          (fd.fs.length ? '<button class="ct" data-col="' + sec.id + '|' + idx + '">' + (it.collapsed ? '▸' : '▾') + '</button>' : '') +
          '<b data-col="' + sec.id + '|' + idx + '">' + esc(title) + '</b>' + extra +
          (fd.rep ? '<button class="dup" data-dup="' + sec.id + '|' + idx + '" title="Duplicate">⧉</button>' : '') +
          '<button class="x" data-rm="' + sec.id + '|' + idx + '">✕</button></div>' +
          (it.collapsed ? (sum ? '<div class="isum">' + esc(sum) + '</div>' : '') :
            (fd.fs.length ? '<div class="ifs">' + fd.fs.map(f => fieldHTML(f, it.v[f.k], sec.id + '|i|' + idx + '|' + f.k)).join('') + '</div>' : '')) + '</div>';
        if (fd.rep && isLast) out += '<button class="another" data-another="' + sec.id + '|' + fd.id + '">+ Add another ' + esc(lc(fd.l.replace(/ \(.*\)$/, ''))) + '</button>';
        return out;
      }).join('') + '</div>';
    }
    if (sec.fd.length) {
      h += '<div class="add-l">Add finding</div><div class="chips add">' + sec.fd.map(fd => {
        const on = st.items.some(i => i.fid === fd.id);
        return '<button class="chip' + (on ? ' sel' : '') + '" data-add="' + sec.id + '|' + fd.id + '">' + (on && fd.rep ? '+ ' : '') + esc(fd.l) + '</button>';
      }).join('') + '</div>';
    }
    h += '<label class="fld wide note"><span>Additional remarks (appended)</span><textarea rows="2" data-p="' + sec.id + '|note">' + esc(st.note || '') + '</textarea></label>';
    h += '<div class="prev"><div class="pl">Report text</div>' + (sec.lab ? '<b>' + esc(sec.lab) + ' :</b> ' : '') + esc(r.text) + (r.imps.length ? '<div class="pi">→ ' + r.imps.map(i => esc(typeof i === 'string' ? i : i.f(i.side === 'R' ? 'right kidney' : 'left kidney'))).join('<br>→ ') + '</div>' : '') + '</div>';
    h += '</div>';
  }
  return h + '</section>';
}

async function addMachine() {
  const v = await askText('Add machine', 'e.g. Philips EPIQ 7');
  if (!v) return;
  if (!settings.machines.includes(v)) { settings.machines.push(v); LS.set('usg_settings', settings); }
  state.machine = v; LS.set('usg_last', Object.assign(LS.get('usg_last', {}), { machine: v })); save(); renderBuilder(); toast('Machine added');
}

// new instance of a repeatable finding: collapse the earlier ones and insert after the last of its kind
function addInstance(st, fd) {
  let last = -1;
  st.items.forEach((o, i) => { if (o.fid === fd.id) { o.collapsed = true; last = i; } });
  const it = newItem(fd);
  if (last >= 0) st.items.splice(last + 1, 0, it); else st.items.push(it);
}

function itemSummary(fd, v) {
  const bits = [];
  fd.fs.forEach(f => { const x = v[f.k];
    if (f.t === 'dims') { const d = dims(x); if (d) bits.push(d + ' ' + (f.u || '')); }
    else if (f.t === 'multi') { if (x && x.length) bits.push(x.join(', ')); }
    else if (f.t === 'chk') { if (x) bits.push(f.l); }
    else if (has(x)) bits.push(x + (f.u ? ' ' + f.u : '')); });
  return bits.slice(0, 6).join(' · ');
}

  const tpl = TEMPLATES.find(t => t.id === state.tpl);
  const p = state.patient;
  const mach = settings.machines.slice(); if (state.machine && !mach.includes(state.machine)) mach.push(state.machine);
  let h = '<div class="bar"><button class="icon" id="bBack">‹</button><div class="bt">' + esc(tpl.title) + '</div><button class="pri" id="bPrev">Preview</button></div>';
  h += '<div class="card pt-card"><div class="grid2">' +
    '<label class="fld wide"><span>Patient name</span><input type="text" data-pt="name" value="' + esc(p.name) + '"></label>' +
    '<label class="fld"><span>Age</span><input type="text" inputmode="numeric" data-pt="age" value="' + esc(p.age) + '"></label>' +
    '<div class="fld"><span>Sex</span><div class="seg"><button data-sex="F" class="' + (p.sex === 'F' ? 'on' : '') + '">Female</button><button data-sex="M" class="' + (p.sex === 'M' ? 'on' : '') + '">Male</button></div></div>' +
    (p.sex === 'F' && tpl.secs.includes('uterus') ? '<label class="fld"><span>Menopausal status</span><select data-pt="meno">' + ['Pre-menopausal', 'Post-menopausal'].map(o => '<option' + (p.meno === o ? ' selected' : '') + '>' + o + '</option>').join('') + '</select></label>' : '') +
    '<label class="fld"><span>Patient ID</span><input type="text" data-pt="pid" value="' + esc(p.pid) + '"></label>' +
    '<label class="fld"><span>Date</span><input type="date" data-pt="date" value="' + esc(p.date) + '"></label>' +
    '<label class="fld wide"><span>Ref. by</span><input type="text" data-pt="ref" value="' + esc(p.ref) + '"></label>' +
    '<div class="fld wide"><span>Machine</span><div class="inw"><select id="mach">' + mach.map(m => '<option' + (m === state.machine ? ' selected' : '') + '>' + esc(m) + '</option>').join('') + '<option value="">— none (omit line) —</option><option value="__add">+ Add machine…</option></select><button class="ghostb addm" id="machAdd">+ Add</button></div></div>' +
    '<label class="fld wide"><span>Clinical details (optional)</span><input type="text" data-pt="ind" value="' + esc(p.ind) + '"></label>' +
    '</div></div>';
  h += '<div class="secs">' + activeSections(state).map(secHTML).join('') + '</div>';
  h += '<div class="card"><label class="fld wide"><span>Additional impression lines (one per line)</span><textarea rows="2" id="extraImp">' + esc(state.extraImp || '') + '</textarea></label></div>';
  h += '<div class="bottom-pad"></div><button class="fab" id="fabPrev">Preview report ›</button>';
  $('#builder').innerHTML = h;
  bindBuilder();
}

function rerenderSec(id) {
  const el = document.querySelector('.sec[data-sec="' + id + '"]');
  if (!el) return;
  const tmp = document.createElement('div'); tmp.innerHTML = secHTML(SECTIONS[id]);
  el.replaceWith(tmp.firstChild);
  bindBuilder();
}
function refreshPreviews(id) {
  // update preview/badge only without re-rendering inputs (keeps focus while typing)
  const el = document.querySelector('.sec[data-sec="' + id + '"]');
  if (!el) return;
  const tmp = document.createElement('div'); tmp.innerHTML = secHTML(SECTIONS[id]);
  const n = tmp.firstChild;
  const a = el.querySelector('.prev'), b = n.querySelector('.prev'); if (a && b) a.replaceWith(b);
  el.querySelector('.badge').replaceWith(n.querySelector('.badge'));
  const trs = n.querySelectorAll('.tr'), old = el.querySelectorAll('.tr'); old.forEach((o, i) => trs[i] && o.replaceWith(trs[i]));
}
function setPath(path, value, idx) {
  const [sid, kind, a, b] = path.split('|');
  const st = secState(state, sid);
  if (kind === 'note') { st.note = value; return sid; }
  const obj = kind === 'm' ? st.m : st.items[+a].v;
  const key = kind === 'm' ? a : b;
  if (idx !== undefined) { if (!Array.isArray(obj[key])) obj[key] = ['', '', '']; obj[key][idx] = value; }
  else obj[key] = value;
  return sid;
}
function bindBuilder() {
  const B = $('#builder');
  $('#bBack').onclick = () => { save(); renderHome(); show('home'); };
  $('#bPrev').onclick = $('#fabPrev').onclick = () => { save(); editedHTML = null; renderPreview(); show('preview'); };
  B.querySelectorAll('[data-pt]').forEach(el => el.oninput = el.onchange = () => { state.patient[el.dataset.pt] = el.value; save(); if (el.dataset.pt === 'meno') activeSections(state).forEach(s => open[s.id] && refreshPreviews(s.id)); });
  B.querySelectorAll('[data-sex]').forEach(el => el.onclick = () => { state.patient.sex = el.dataset.sex; LS.set('usg_last', Object.assign(LS.get('usg_last', {}), { sex: el.dataset.sex })); save(); renderBuilder(); });
  $('#machAdd').onclick = addMachine;
  $('#mach').onchange = e => {
    let v = e.target.value;
    if (v === '__add') { e.target.value = state.machine; addMachine(); return; }
    state.machine = v; LS.set('usg_last', Object.assign(LS.get('usg_last', {}), { machine: v })); save(); renderBuilder();
  };
  $('#extraImp').oninput = e => { state.extraImp = e.target.value; save(); };
  B.querySelectorAll('[data-tog]').forEach(el => el.onclick = () => { const id = el.dataset.tog; open[id] = !open[id]; rerenderSec(id); });
  B.querySelectorAll('input[data-p], textarea[data-p]').forEach(el => el.oninput = () => {
    const sid = setPath(el.dataset.p, el.value, el.dataset.i !== undefined ? +el.dataset.i : undefined); save(); refreshPreviews(sid);
  });
  B.querySelectorAll('select[data-p]').forEach(el => el.onchange = () => { const sid = setPath(el.dataset.p, el.value); save(); refreshPreviews(sid); });
  B.querySelectorAll('[data-seg]').forEach(el => el.onclick = () => { const sid = setPath(el.dataset.seg, el.dataset.o); save(); rerenderSec(sid); });
  B.querySelectorAll('[data-chk]').forEach(el => el.onclick = () => {
    const [sid, , a, b] = el.dataset.chk.split('|'); const v = secState(state, sid).items[+a].v; v[b] = !v[b]; save(); rerenderSec(sid);
  });
  B.querySelectorAll('[data-multi]').forEach(el => el.onclick = () => {
    const [sid, , a, b] = el.dataset.multi.split('|'); const v = secState(state, sid).items[+a].v;
    const arr = v[b] = v[b] || []; const o = el.dataset.o; const i = arr.indexOf(o); if (i >= 0) arr.splice(i, 1); else arr.push(o); save(); rerenderSec(sid);
  });
  B.querySelectorAll('[data-add]').forEach(el => el.onclick = () => {
    const [sid, fid] = el.dataset.add.split('|'); const sec = SECTIONS[sid], fd = sec.fd.find(f => f.id === fid), st = secState(state, sid);
    const exists = st.items.findIndex(i => i.fid === fid);
    if (exists >= 0 && !fd.rep) { st.items.splice(exists, 1); } else addInstance(st, fd);
    save(); rerenderSec(sid);
  });
  B.querySelectorAll('[data-another]').forEach(el => el.onclick = () => {
    const [sid, fid] = el.dataset.another.split('|'); addInstance(secState(state, sid), SECTIONS[sid].fd.find(f => f.id === fid)); save(); rerenderSec(sid);
  });
  B.querySelectorAll('[data-dup]').forEach(el => el.onclick = () => {
    const [sid, idx] = el.dataset.dup.split('|'); const st = secState(state, sid);
    st.items.forEach(o => { if (o.fid === st.items[+idx].fid) o.collapsed = true; });
    const copy = JSON.parse(JSON.stringify(st.items[+idx])); copy.uid = Math.random().toString(36).slice(2, 9); copy.collapsed = false;
    st.items.splice(+idx + 1, 0, copy); save(); rerenderSec(sid); toast('Duplicated – edit size / location');
  });
  B.querySelectorAll('[data-col]').forEach(el => el.onclick = () => {
    const [sid, idx] = el.dataset.col.split('|'); const it = secState(state, sid).items[+idx]; it.collapsed = !it.collapsed; save(); rerenderSec(sid);
  });
  B.querySelectorAll('[data-rm]').forEach(el => el.onclick = () => { const [sid, idx] = el.dataset.rm.split('|'); secState(state, sid).items.splice(+idx, 1); save(); rerenderSec(sid); });
}

/* ================= PREVIEW ================= */
function renderPreview() {
  let h = '<div class="bar"><button class="icon" id="pBack">‹</button><div class="bt">Report</div><button class="ghostb" id="pEdit">Edit text</button><button class="icon" id="pHome" title="Home">⌂</button></div>';
  h += '<div class="paper"><div id="rep" spellcheck="false">' + (editedHTML || reportHTML(state, settings)) + '</div></div>';
  h += '<div class="actions"><button id="aCopy">Copy</button><button id="aShare">Share</button><button id="aPrint" class="pri">Print / PDF</button><button id="aSave">Save</button></div>';
  $('#preview').innerHTML = h;
  const rep = $('#rep');
  $('#pBack').onclick = async () => {
    if (editedHTML && !(await ask('Going back to the builder discards the manual text edits. Continue?', 'Discard edits', true))) return;
    editedHTML = null; renderBuilder(); show('builder');
  };
  $('#pHome').onclick = () => { renderHome(); show('home'); };
  $('#pEdit').onclick = () => {
    const on = rep.contentEditable !== 'true'; rep.contentEditable = on; rep.classList.toggle('editing', on);
    $('#pEdit').textContent = on ? 'Done' : 'Edit text'; if (on) rep.focus(); else editedHTML = rep.innerHTML;
  };
  rep.oninput = () => { editedHTML = rep.innerHTML; state._saved = false; LS.set('usg_draft', state); };
  const text = () => rep.innerText.replace(/\n{3,}/g, '\n\n').trim();
  $('#aCopy').onclick = () => {
    if (Bridge) { Bridge.copy(text()); return; }
    const t = text();
    const fallback = () => { const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;opacity:0'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length); const ok = document.execCommand('copy'); ta.remove(); toast(ok ? 'Report copied' : 'Copy failed'); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(() => toast('Report copied'), fallback); else fallback();
  };
  $('#aShare').onclick = () => {
    if (Bridge) { Bridge.share(text(), fileTitle()); return; }
    if (navigator.share) navigator.share({ title: fileTitle(), text: text() }).catch(() => {}); else $('#aCopy').onclick();
  };
  $('#aPrint').onclick = () => {
    const doc = printDoc(rep.innerHTML);
    if (Bridge) { Bridge.print(doc, fileTitle()); return; }
    // iOS / browsers: print the on-page report via print CSS (popups are blocked in home-screen apps).
    // In the iOS print sheet, pinch-out on the preview (or Share → Save to Files) to get a PDF.
    const t0 = document.title; document.title = fileTitle(); window.print(); setTimeout(() => { document.title = t0; }, 1000);
  };
  $('#aSave').onclick = () => {
    const all = LS.get('usg_hist', []);
    const id = state._hid || Date.now().toString(36);
    state._hid = id;
    const rec = { id, state: JSON.parse(JSON.stringify(Object.assign({}, state, { _saved: true }))), html: editedHTML };
    const i = all.findIndex(r => r.id === id); if (i >= 0) all[i] = rec; else all.push(rec);
    LS.set('usg_hist', all.slice(-300)); state._saved = true; LS.set('usg_draft', state); toast('Report saved');
  };
}
function fileTitle() { const p = state.patient; return ('USG ' + TEMPLATES.find(t => t.id === state.tpl).title + ' ' + (p.name || '') + ' ' + fmtDate(p.date)).trim(); }
function printDoc(inner) {
  return '<!doctype html><html><head><meta charset="utf-8"><title>' + esc(fileTitle()) + '</title><style>' + REPORT_CSS + '@page{size:A4;margin:14mm 16mm}body{margin:0}</style></head><body>' + inner + '</body></html>';
}

/* ================= SETTINGS ================= */
function openSettings() {
  const s = settings;
  $('#modal').innerHTML = '<div class="mbox"><div class="mh">Settings</div>' +
    '<label class="fld wide"><span>Hospital / centre name</span><input id="sInst" value="' + esc(s.inst) + '"></label>' +
    '<label class="fld wide"><span>Address line</span><input id="sAddr" value="' + esc(s.addr) + '"></label>' +
    '<button class="chip tog' + (s.letterhead ? ' on' : '') + '" id="sLh">Printing on pre-printed letterhead (leave top space)</button>' +
    '<label class="fld"><span>Top space (mm)</span><input type="number" id="sLhs" value="' + esc(s.lhSpace) + '"></label>' +
    '<label class="fld wide"><span>Reporting doctor</span><input id="sDoc" value="' + esc(s.doc) + '"></label>' +
    '<label class="fld wide"><span>Qualification / designation</span><input id="sQual" value="' + esc(s.qual) + '"></label>' +
    '<label class="fld wide"><span>Registration no.</span><input id="sReg" value="' + esc(s.reg) + '"></label>' +
    '<label class="fld wide"><span>Footer note</span><input id="sFoot" value="' + esc(s.foot) + '" placeholder="e.g. Kindly correlate clinically."></label>' +
    '<label class="fld wide"><span>Machines (one per line)</span><textarea id="sMach" rows="4">' + esc(s.machines.join('\n')) + '</textarea></label>' +
    (Bridge ? '' : '<div class="fld wide"><span>Backup (saved reports + settings)</span><div class="inw"><button class="ghostb" id="sExp">Export backup</button><label class="ghostb filel">Restore backup<input type="file" id="sImp" accept=".json,application/json" hidden></label></div></div>') +
    '<div class="mact"><button class="ghostb" id="sCancel">Cancel</button><button class="pri" id="sOk">Save</button></div></div>';
  $('#modal').hidden = false;
  let lh = s.letterhead;
  $('#sLh').onclick = e => { lh = !lh; e.target.classList.toggle('on', lh); };
  $('#sCancel').onclick = () => closeModal();
  if ($('#sExp')) $('#sExp').onclick = exportBackup;
  if ($('#sImp')) $('#sImp').onchange = e => importBackup(e.target.files[0]);
  $('#sOk').onclick = () => {
    Object.assign(settings, { inst: $('#sInst').value, addr: $('#sAddr').value, letterhead: lh, lhSpace: $('#sLhs').value, doc: $('#sDoc').value, qual: $('#sQual').value, reg: $('#sReg').value, foot: $('#sFoot').value,
      machines: $('#sMach').value.split('\n').map(x => x.trim()).filter(Boolean) });
    LS.set('usg_settings', settings); closeModal(); toast('Settings saved'); if (!$('#builder').hidden) renderBuilder();
  };
}

/* ================= BACKUP ================= */
async function exportBackup() {
  const data = JSON.stringify({ app: 'usg-reporter', v: 1, at: new Date().toISOString(), settings, hist: LS.get('usg_hist', []) });
  const name = 'USG-Reporter-backup-' + today() + '.json';
  const file = new File([data], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function importBackup(f) {
  if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    let d; try { d = JSON.parse(r.result); } catch (e) { toast('Not a valid backup file'); return; }
    if (!d || d.app !== 'usg-reporter') { toast('Not a USG Reporter backup'); return; }
    if (!(await ask('Restore ' + (d.hist || []).length + ' saved reports and settings? Reports with the same ID are replaced; others are kept.', 'Restore'))) return;
    const cur = LS.get('usg_hist', []); const ids = new Set((d.hist || []).map(x => x.id));
    LS.set('usg_hist', cur.filter(x => !ids.has(x.id)).concat(d.hist || []));
    if (d.settings) { settings = Object.assign(settings, d.settings); LS.set('usg_settings', settings); }
    renderHome(); show('home'); toast('Backup restored');
  };
  r.readAsText(f);
}

/* Android back button */
window.__onBack = function () {
  if (!$('#modal').hidden) { closeModal(modalDone ? null : undefined); return true; }
  if (!$('#preview').hidden) { $('#pBack').onclick(); return true; }
  if (!$('#builder').hidden) { $('#bBack').onclick(); return true; }
  return false;
};

renderHome(); show('home');

/* Offline support when served over http(s) (iOS / browser install); not used inside the Android shell */
if (!Bridge && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

</script>
