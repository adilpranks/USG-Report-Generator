# Builds the iOS .ipa (GitHub macOS) and Android .apk (Ubuntu) on every push to main.
# Tag a version (git tag v1.4 && git push --tags) → both files attached to a GitHub Release.
#
# Android signing: set repository secret ANDROID_DEBUG_KEYSTORE_B64 (base64 of the keystore that
# signed the installed app) so new APKs install over the old one without losing saved reports.
name: Build apps
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned IPA
        run: ./ios/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with: { name: ios-ipa, path: ios/build/USGReporter-unsigned.ipa }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Signing key
        env: { KS: '${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}' }
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > ~/.android/debug.keystore; echo "Using stored signing key"
          else echo "::warning::ANDROID_DEBUG_KEYSTORE_B64 not set – APK signed with a throwaway key (will not update an existing install)"; fi
      - name: Build APK
        run: |
          rm -rf android/app/src/main/assets && cp -R web android/app/src/main/assets
          cd android && chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon -q
          V=$(grep versionName app/build.gradle | sed "s/[^0-9.]//g")
          mkdir -p ../dist && cp app/build/outputs/apk/debug/app-debug.apk "../dist/USG-Reporter-v$V.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: dist/*.apk }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ios, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            **Android:** download the `.apk` → open it on the phone → allow "install unknown apps" if asked. Installs over the previous version; saved reports are kept.
            **iPhone:** download the `.ipa` → install with Sideloadly using your Apple ID (re-sign every 7 days with a free Apple ID).
            **Browser / iPhone home-screen app:** https://adilpranks.github.io/USG-Report-Generator/
